/* Generic transaction list renderer used by Dashboard + Account view (recent lists) */
function renderTxnListGeneric(list, opts){
  opts = opts || {};
  var desktop = '<table class="ledger ledger-desktop"><thead><tr><th>Date</th><th>Description</th>'+(opts.showAccount?'<th>Account</th>':'')+'<th>Category</th><th class="num">Amount</th></tr></thead><tbody>'+
    list.map(function(t){ return txnRowDesktop(t, opts); }).join('')+
  '</tbody></table>';
  var mobile = '<div class="ledger-mobile">'+ list.map(function(t){ return txnRowMobile(t, opts); }).join('') +'</div>';
  return desktop + mobile;

function txnTypeSign(t){ return t.type==='income' ? '+' : (t.type==='expense' ? '−' : '⇄'); }
function txnAmountClass(t){ return t.type==='income' ? 'income' : (t.type==='expense' ? 'expense' : 'transfer'); }
function txnDescLabel(t){
  if(t.description) return t.description;
  if(t.type==='transfer') return 'Transfer';
  var c = t.category ? getCategory(t.category) : null;
  return c ? c.name : (t.type==='income' ? 'Income' : 'Expense');
}
function recurringBadge(t){
  return t.recurringId ? '<span class="repeat-badge" title="Generated by a recurring transaction">'+icon('repeat')+'</span>' : '';
}
function txnMetaLabel(t, opts){
  var bits = [];
  if(opts.showAccount){
    var from = getAccount(t.account);
    if(t.type==='transfer'){
      var to = getAccount(t.toAccount);
      bits.push((from?from.name:'?')+' → '+(to?to.name:'?'));
    } else bits.push(from?from.name:'?');
  }
  if(t.type!=='transfer' && t.category){
    var c = getCategory(t.category);
    if(c) bits.push(c.name);
  }
  return bits.join(' · ');
}

function txnRowDesktop(t, opts){
  var cat = t.category ? getCategory(t.category) : null;
  var from = getAccount(t.account), to = t.toAccount ? getAccount(t.toAccount) : null;
  return '<tr onclick="Ledger.openTxnModal(\''+t.id+'\')" style="cursor:pointer;">'+
    '<td class="muted">'+formatDateShort(t.date)+'</td>'+
    '<td class="desc">'+recurringBadge(t)+escapeHtml(txnDescLabel(t))+(t.tags&&t.tags.length?'<span class="meta">'+t.tags.map(function(tg){return '#'+escapeHtml(tg);}).join(' ')+'</span>':'')+'</td>'+
    (opts.showAccount ? '<td class="acct-tag">'+(t.type==='transfer' ? (escapeHtml(from?from.name:'?')+' → '+escapeHtml(to?to.name:'?')) : escapeHtml(from?from.name:'?'))+'</td>' : '')+
    '<td>'+(cat ? '<span class="cat-chip"><span class="cat-dot" style="background:'+cat.color+';"></span>'+escapeHtml(cat.name)+'</span>' : (t.type==='transfer'?'<span class="muted">—</span>':'<span class="muted">Uncategorized</span>'))+'</td>'+
    '<td class="num amt '+txnAmountClass(t)+'">'+txnTypeSign(t)+' '+formatMoney(t.amount, t.currency)+'</td>'+
  '</tr>';
}
function txnRowMobile(t, opts){
  return '<div class="txn-row" onclick="Ledger.openTxnModal(\''+t.id+'\')">'+

        '<td>'+(cat ? '<span class="cat-chip"><span class="cat-dot" style="background:'+cat.color+';"></span>'+escapeHtml(cat.name)+'</span>' : '<span class="muted">—</span>')+'</td>'+
        '<td class="num amt '+(e.signed>=0?'income':'expense')+'">'+(e.signed>=0?'+':'−')+' '+formatMoney(Math.abs(e.signed), t.currency)+'</td>'+
        '<td class="num running">'+formatMoney(e.running, t.currency)+'</td>'+
        '<td><div class="row-actions"><button class="btn icon-only sm" onclick="Ledger.openTxnModal(\''+t.id+'\')">'+icon('edit')+'</button><button class="btn icon-only sm" onclick="Ledger.confirmDeleteTxn(\''+t.id+'\')">'+icon('trash')+'</button></div></td>'+
      '</tr>';
    }).join('')+
  '</tbody></table>';
  var mobile = '<div class="ledger-mobile">'+ entries.map(function(e){
    var t = e.txn;
    return '<div class="txn-row" onclick="Ledger.openTxnModal(\''+t.id+'\')">'+
      '<div class="txn-left"><div class="desc">'+recurringBadge(t)+escapeHtml(txnDescLabel(t))+'</div><div class="meta">'+formatDateShort(t.date)+'</div></div>'+
      '<div class="txn-right"><div class="amt '+(e.signed>=0?'income':'expense')+'">'+(e.signed>=0?'+':'−')+' '+formatMoney(Math.abs(e.signed), t.currency)+'</div><span class="running">'+formatMoney(e.running, t.currency)+'</span></div>'+
    '</div>';
  }).join('') + '</div>';
  return desktop + mobile;
}


/* ============================================================
   ALL TRANSACTIONS VIEW — filter, sort, search, inline edit/delete
   ============================================================ */
function renderTransactionsView(root){
  var f = state.filters;
  var accs = listAccounts({includeArchived:true});
  var cats = listCategories();
  var list = filteredTransactions(f);

  root.innerHTML =
    '<div class="view-head"><div><h1>All transactions</h1><div class="sub">'+list.length+' transaction'+(list.length===1?'':'s')+'</div></div>'+
      '<div class="btn-row"><button class="btn" onclick="Ledger.exportFilteredCSV()">'+icon('download')+' Export CSV</button><button class="btn primary" onclick="Ledger.openTxnModal()">'+icon('plus')+' Add transaction</button></div>'+
    '</div>'+
    '<div class="filters-bar">'+
      '<div class="field search"><label>Search</label><input type="text" id="flt-q" placeholder="Description, notes, tags…" value="'+escapeHtml(f.q)+'" oninput="Ledger.updateFilter(\'q\',this.value)"></div>'+
      '<div class="field"><label>Account</label><select id="flt-account" onchange="Ledger.updateFilter(\'account\',this.value)">'+
        '<option value="">All accounts</option>'+ accs.map(function(a){ return '<option value="'+a.id+'"'+(f.account===a.id?' selected':'')+'>'+escapeHtml(a.name)+'</option>'; }).join('') +
      '</select></div>'+
      '<div class="field"><label>Category</label><select id="flt-category" onchange="Ledger.updateFilter(\'category\',this.value)">'+
        '<option value="">All categories</option>'+ cats.map(function(c){ return '<option value="'+c.id+'"'+(f.category===c.id?' selected':'')+'>'+escapeHtml(c.name)+'</option>'; }).join('') +
      '</select></div>'+
      '<div class="field"><label>Type</label><select id="flt-type" onchange="Ledger.updateFilter(\'type\',this.value)">'+
        ['','income','expense','transfer'].map(function(t){ return '<option value="'+t+'"'+(f.type===t?' selected':'')+'>'+(t?t.charAt(0).toUpperCase()+t.slice(1):'All types')+'</option>'; }).join('') +
      '</select></div>'+
      '<div class="field"><label>From</label><input type="date" id="flt-from" value="'+f.from+'" onchange="Ledger.updateFilter(\'from\',this.value)"></div>'+
      '<div class="field"><label>To</label><input type="date" id="flt-to" value="'+f.to+'" onchange="Ledger.updateFilter(\'to\',this.value)"></div>'+
      '<div class="field"><label>Sort</label><select id="flt-sort" onchange="Ledger.updateFilter(\'sort\',this.value)">'+
        '<option value="date_desc"'+(f.sort==='date_desc'?' selected':'')+'>Newest first</option>'+
        '<option value="date_asc"'+(f.sort==='date_asc'?' selected':'')+'>Oldest first</option>'+
        '<option value="amount_desc"'+(f.sort==='amount_desc'?' selected':'')+'>Amount: high to low</option>'+
        '<option value="amount_asc"'+(f.sort==='amount_asc'?' selected':'')+'>Amount: low to high</option>'+
      '</select></div>'+
      (hasActiveFilters(f) ? '<div class="field"><label>&nbsp;</label><button class="btn sm" onclick="Ledger.clearFilters()">Clear filters</button></div>' : '')+
    '</div>'+
    (list.length===0 ? renderEmptyTxns() : renderTxnListGeneric(list, {showAccount:true}));
}
function hasActiveFilters(f){ return !!(f.q||f.account||f.category||f.type||f.from||f.to); }
function updateFilter(key, val){
  state.filters[key] = val;
  render();
  // restore focus to the search box after re-render if that's what's being typed in
  if(key==='q'){ var el = qs('#flt-q'); if(el){ el.focus(); el.value = val; el.setSelectionRange(val.length,val.length); } }
}
function clearFilters(){
  state.filters = {q:'', account:'', category:'', type:'', from:'', to:'', sort:'date_desc'};
  render();
}


/* ============================================================
   REPORTS VIEW
   ============================================================ */
var reportsState = { month: currentMonthKey() };

function renderReportsView(root){
  var ym = reportsState.month;
  var totals = monthlyTotals(ym);
  var months = lastNMonthKeys(12);
  var breakdown = categoryBreakdown(ym, 'expense');
  var accts = accountBreakdown();

  root.innerHTML =
    '<div class="view-head"><div><h1>Reports</h1><div class="sub">Monthly summaries, category and account breakdowns</div></div>'+
      '<div class="btn-row"><button class="btn" onclick="Ledger.exportAllCSV()">'+icon('download')+' Export all (CSV)</button></div>'+
    '</div>'+
    '<div class="filters-bar">'+
      '<div class="field"><label>Month</label><select id="rpt-month" onchange="Ledger.setReportMonth(this.value)">'+
        months.map(function(m){ return '<option value="'+m+'"'+(m===ym?' selected':'')+'>'+monthLabel(m)+'</option>'; }).join('')+
      '</select></div>'+
    '</div>'+
    '<div class="stat-row">'+
      '<div class="stat-card"><div class="label">Income — '+monthLabel(ym)+'</div><div class="value income tnum">'+formatMoney(totals.income, state.data.meta.defaultCurrency)+'</div></div>'+
      '<div class="stat-card"><div class="label">Expenses — '+monthLabel(ym)+'</div><div class="value expense tnum">'+formatMoney(totals.expense, state.data.meta.defaultCurrency)+'</div></div>'+
      '<div class="stat-card"><div class="label">Net</div><div class="value tnum'+(totals.net<0?' expense':'')+'">'+formatMoney(totals.net, state.data.meta.defaultCurrency)+'</div></div>'+
    '</div>'+

    '<div class="chart-grid">'+
      '<div class="chart-card"><h3>Monthly income vs. expenses (12 months)</h3><div class="chart-wrap"><canvas id="chart-monthly-summary"></canvas></div></div>'+
      '<div class="chart-card"><h3>Category breakdown — '+monthLabel(ym)+'</h3><div class="chart-wrap" id="chart-cat-breakdown-wrap"><canvas id="chart-cat-breakdown"></canvas></div></div>'+
    '</div>'+

    '<div class="section-title"><h2>Per-account breakdown</h2></div>'+
    '<div class="card"><table class="ledger ledger-desktop"><thead><tr><th>Account</th><th>Type</th><th class="num">Balance</th></tr></thead><tbody>'+
      accts.map(function(x){ return '<tr><td class="desc">'+escapeHtml(x.account.name)+'</td><td class="muted">'+escapeHtml(x.account.type)+'</td><td class="num amt '+(x.balance<0?'expense':'income')+'">'+formatMoney(x.balance,x.account.currency)+'</td></tr>'; }).join('')+
    '</tbody></table>'+
    '<div class="ledger-mobile">'+ accts.map(function(x){ return '<div class="txn-row"><div class="txn-left"><div class="desc">'+escapeHtml(x.account.name)+'</div><div class="meta">'+escapeHtml(x.account.type)+'</div></div><div class="txn-right"><div class="amt '+(x.balance<0?'expense':'income')+'">'+formatMoney(x.balance,x.account.currency)+'</div></div></div>'; }).join('')+'</div>'+
    '</div>'+

    '<div class="section-title"><h2>Category breakdown table</h2></div>'+
    (breakdown.length===0 ? '<div class="empty-state"><p>No expenses recorded for '+monthLabel(ym)+'.</p></div>' :
      '<div class="card"><table class="ledger ledger-desktop"><thead><tr><th>Category</th><th class="num">Total</th><th class="num">Share</th></tr></thead><tbody>'+
        breakdown.map(function(b){
          var pct = totals.expense>0 ? (b.total/totals.expense*100) : 0;
          return '<tr><td><span class="cat-chip"><span class="cat-dot" style="background:'+b.color+';"></span>'+escapeHtml(b.name)+'</span></td><td class="num amt expense">'+formatMoney(b.total, state.data.meta.defaultCurrency)+'</td><td class="num muted">'+pct.toFixed(1)+'%</td></tr>';
        }).join('')+
      '</tbody></table>'+
      '<div class="ledger-mobile">'+ breakdown.map(function(b){
        var pct = totals.expense>0 ? (b.total/totals.expense*100) : 0;
        return '<div class="txn-row"><div class="txn-left"><div class="desc">'+escapeHtml(b.name)+'</div><div class="meta">'+pct.toFixed(1)+'% of expenses</div></div><div class="txn-right"><div class="amt expense">'+formatMoney(b.total, state.data.meta.defaultCurrency)+'</div></div></div>';
      }).join('')+'</div></div>'
    );

  drawMonthlySummaryChart(months);
  drawCategoryBreakdownChart(breakdown);
}
function setReportMonth(m){ reportsState.month = m; render(); }
function lastNMonthKeys(n){
  var out=[]; var today=new Date();
  for(var i=0;i<n;i++){ var d=new Date(today.getFullYear(), today.getMonth()-i, 1); out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return out;
}

/* ============================================================
   CSV EXPORT
   ============================================================ */
function txnToRow(t){
  var acc = getAccount(t.account), to = t.toAccount ? getAccount(t.toAccount) : null, cat = t.category ? getCategory(t.category) : null;
  return {
    date: t.date, type: t.type, account: acc?acc.name:'', to_account: to?to.name:'',
    category: cat?cat.name:'', amount: t.amount, currency: t.currency,
    description: t.description, notes: t.notes, tags: (t.tags||[]).join('|'),
    recurring: t.recurringId ? 'yes' : ''
  };
}
var CSV_HEADERS = ['date','type','account','to_account','category','amount','currency','description','notes','tags','recurring'];
function exportAllCSV(){
  var rows = sortTxnsChrono(state.data.transactions).map(txnToRow);
  var csv = toCSV(rows, CSV_HEADERS);
  downloadBlob('cashbook-all-transactions.csv', csv, 'text/csv');
  toast('Exported '+rows.length+' transactions.', 'ok');
}
function exportFilteredCSV(){
  var rows = filteredTransactions(state.filters).map(txnToRow);
  var csv = toCSV(rows, CSV_HEADERS);
  downloadBlob('cashbook-transactions.csv', csv, 'text/csv');
  toast('Exported '+rows.length+' transactions.', 'ok');
}

/* ============================================================
   CHARTS (Chart.js)
   ============================================================ */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function destroyChart(id){ if(state.charts[id]){ state.charts[id].destroy(); delete state.charts[id]; } }
function chartFallback(canvas, msg){
  if(canvas && canvas.parentElement) canvas.parentElement.innerHTML =
    '<div class="chart-empty"><span>'+msg+'</span><button class="btn sm" style="margin-top:8px;" onclick="Ledger.retryChartsLoad(this)">'+icon('refresh')+' Retry</button></div>';
}
var CHART_LIB_MSG = 'Charts need the Chart.js library from a CDN. It could not be loaded from any of a few mirrors — a network filter, firewall, or ad-blocker on this connection may be blocking it, even with wifi otherwise working.';

// Retries the CDN chain on demand (e.g. the "Retry" button in a fallback
// message) and re-renders once/if it succeeds, without a full page reload.
function retryChartsLoad(btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Retrying…'; }
  window.loadChartJs(function(ok){
    if(ok){ toast('Chart library loaded.', 'ok'); render(); }
    else toast('Still could not reach any chart CDN. Check your network, firewall, or ad-blocker.', 'error');
  });
}
// Called by the loader in <head> once it succeeds or exhausts every mirror.
// If charts are on screen, re-render so they appear without user action.
window.__onChartJsReady = function(ok){
  if(ok && state.route && (state.route.name==='dashboard' || state.route.name==='reports')) render();
};

function drawBalanceTrendChart(){
  var canvas = qs('#chart-balance-trend');
  if(!canvas) return;
  if(typeof Chart==='undefined'){ chartFallback(canvas, CHART_LIB_MSG); return; }
  var series = balanceTrendSeries(6);
  destroyChart('chart-balance-trend');
  state.charts['chart-balance-trend'] = new Chart(canvas, {
    type:'line',
    data:{ labels: series.labels, datasets:[{
      data: series.values, borderColor: cssVar('--accent'), backgroundColor: cssVar('--accent-soft'),
      fill:true, tension:.35, pointRadius:3, pointBackgroundColor: cssVar('--accent')
    }]},
    options: baseChartOptions({ y:{ ticks:{ callback:function(v){ return formatMoney(v, series.currency); } } } })
  });
}

function drawCategorySpendChart(ym){
  var canvas = qs('#chart-cat-spend');
  if(!canvas) return;
  if(typeof Chart==='undefined'){ chartFallback(canvas, CHART_LIB_MSG); return; }
  var breakdown = categoryBreakdown(ym, 'expense').slice(0,7);
  destroyChart('chart-cat-spend');
  if(breakdown.length===0){
    qs('#chart-cat-wrap').innerHTML = '<div class="chart-empty">No expenses recorded this month yet.</div>';
    return;
  }
  state.charts['chart-cat-spend'] = new Chart(canvas, {
    type:'doughnut',
    data:{ labels: breakdown.map(function(b){return b.name;}), datasets:[{ data: breakdown.map(function(b){return b.total;}), backgroundColor: breakdown.map(function(b){return b.color;}), borderColor: cssVar('--bg-elev'), borderWidth:2 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ color: cssVar('--ink-soft'), boxWidth:10, font:{size:11} } } } }
  });
}

function drawMonthlySummaryChart(months){
  var canvas = qs('#chart-monthly-summary');
  if(!canvas) return;
  if(typeof Chart==='undefined'){ chartFallback(canvas, CHART_LIB_MSG); return; }
  var mrev = months.slice().reverse();
  var incomeData = mrev.map(function(m){ return monthlyTotals(m).income; });
  var expenseData = mrev.map(function(m){ return monthlyTotals(m).expense; });
  destroyChart('chart-monthly-summary');
  state.charts['chart-monthly-summary'] = new Chart(canvas, {
    type:'bar',
    data:{ labels: mrev.map(monthLabel), datasets:[
      { label:'Income', data:incomeData, backgroundColor: cssVar('--income'), borderRadius:4, maxBarThickness:22 },
      { label:'Expenses', data:expenseData, backgroundColor: cssVar('--expense'), borderRadius:4, maxBarThickness:22 }
    ]},
    options: baseChartOptions({ y:{ ticks:{ callback:function(v){ return formatMoney(v, state.data.meta.defaultCurrency); } } } }, true)
  });
}

function drawCategoryBreakdownChart(breakdown){
  var canvas = qs('#chart-cat-breakdown');
  if(!canvas) return;
  if(typeof Chart==='undefined'){ chartFallback(canvas, CHART_LIB_MSG); return; }
  destroyChart('chart-cat-breakdown');
  if(breakdown.length===0){
    qs('#chart-cat-breakdown-wrap').innerHTML = '<div class="chart-empty">No expenses recorded for this month.</div>';
    return;
  }
  var top = breakdown.slice(0,8);
  var opts = baseChartOptions({ x:{ ticks:{ callback:function(v){ return formatMoney(v, state.data.meta.defaultCurrency); } } } });
  opts.indexAxis = 'y';
  state.charts['chart-cat-breakdown'] = new Chart(canvas, {
    type:'bar',
    data:{ labels: top.map(function(b){return b.name;}), datasets:[{ data: top.map(function(b){return b.total;}), backgroundColor: top.map(function(b){return b.color;}), borderRadius:4, maxBarThickness:20 }]},
    options: opts
  });
}

function baseChartOptions(extraScales, showLegend){
  var ink = cssVar('--ink-soft'), border = cssVar('--border-soft');
  var opts = {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display: !!showLegend, position:'bottom', labels:{ color: ink, boxWidth:10, font:{size:11} } } },
    scales:{
      x:{ ticks:{ color: ink, font:{size:11} }, grid:{ display:false } },
      y:{ ticks:{ color: ink, font:{size:11} }, grid:{ color: border } }
    }
  };
  if(extraScales && extraScales.y) Object.assign(opts.scales.y, extraScales.y);
  if(extraScales && extraScales.x) Object.assign(opts.scales.x, extraScales.x);
  return opts;
}


/* ============================================================
   THEME + MISC GLOBAL ACTIONS
   ============================================================ */
function toggleTheme(){
  applyTheme(state.theme==='dark' ? 'light' : 'dark');
  render();
}

function togglePrivacyMode(){
  state.privacyMode = !state.privacyMode;
  savePrivacyMode(state.privacyMode);
  render();
}

function nav(hash){ navigate(hash); }

/* ============================================================
   PUBLIC API (exposed for inline onclick handlers in generated HTML)
   ============================================================ */
window.Ledger = {
  nav: nav,
  retryChartsLoad: retryChartsLoad,
  openTxnModal: openTxnModal, pickTxnType: pickTxnType, submitTxnForm: submitTxnForm,
  confirmDeleteTxn: confirmDeleteTxn, doDeleteTxn: doDeleteTxn, checkTransferCurrency: checkTransferCurrency,
  toggleRepeatSection: toggleRepeatSection, pickRepeatEnd: pickRepeatEnd, updateRepeatPreview: updateRepeatPreview,
  openRecurringModal: openRecurringModal, pickRecurringType: pickRecurringType, pickRepeatEnd_: pickRepeatEnd_,
  updateRecurringPreview: updateRecurringPreview, submitRecurringForm: submitRecurringForm,
  confirmDeleteRecurring: confirmDeleteRecurring, doDeleteRecurring: doDeleteRecurring, toggleRecurringActive: toggleRecurringActive,
  openAccountModal: openAccountModal, submitAccountForm: submitAccountForm, pickSwatch: pickSwatch,
  toggleArchiveAccount: toggleArchiveAccount, confirmDeleteAccount: confirmDeleteAccount, doDeleteAccount: doDeleteAccount,
  confirmDeleteAccountCascade: confirmDeleteAccountCascade, doDeleteAccountCascade: doDeleteAccountCascade,
  openCategoryModal: openCategoryModal, submitCategoryForm: submitCategoryForm, pickTypeToggle: pickTypeToggle, pickIconSwatch: pickIconSwatch,
  confirmDeleteCategory: confirmDeleteCategory, doDeleteCategory: doDeleteCategory,
  closeModal: closeModal,
  syncNow: syncNow, testGiteaForm: testGiteaForm, saveGiteaForm: saveGiteaForm,
  resolveConflictKeepMine: resolveConflictKeepMine, resolveConflictLoadTheirs: resolveConflictLoadTheirs,
  setDefaultCurrency: setDefaultCurrency, disconnectStorage: disconnectStorage, doDisconnectStorage: doDisconnectStorage,
  chooseOnboardMode: chooseOnboardMode, onboardBackToPicker: onboardBackToPicker,
  onboardCreateLocalFile: onboardCreateLocalFile, onboardOpenLocalFile: onboardOpenLocalFile,
  onboardManualLoad: onboardManualLoad, onboardStartManualFresh: onboardStartManualFresh,
  switchSettingsStorageTab: switchSettingsStorageTab,
  settingsCreateLocalFile: settingsCreateLocalFile, settingsOpenLocalFile: settingsOpenLocalFile,
  settingsManualLoad: settingsManualLoad, manualSaveLocalFile: manualSaveLocalFile,
  toggleTheme: toggleTheme, togglePrivacyMode: togglePrivacyMode,
  updateFilter: updateFilter, clearFilters: clearFilters,
  setReportMonth: setReportMonth, exportAllCSV: exportAllCSV, exportFilteredCSV: exportFilteredCSV
};

/* ============================================================
   INIT
   ============================================================ */
function init(){
  state.settings = loadSettings();
  state.theme = loadTheme();
  applyTheme(state.theme);
  state.privacyMode = loadPrivacyMode();
  state.route = parseHash();
  initData();
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

</script>
