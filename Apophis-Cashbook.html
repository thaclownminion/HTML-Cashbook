<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apophis Cashbook</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%232F6F62'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23F3F4EE' font-family='Georgia,serif'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>

(function(){
  var CHART_CDN_URLS = [
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js'
  ];
  window.loadChartJs = function(onDone){
    var i = 0;
    function tryNext(){
      if(i >= CHART_CDN_URLS.length){ if(onDone) onDone(false); return; }
      var url = CHART_CDN_URLS[i++];
      var s = document.createElement('script');
      s.src = url;
      s.crossOrigin = 'anonymous';
      s.referrerPolicy = 'no-referrer';
      s.onload = function(){ if(onDone) onDone(true); };
      s.onerror = function(){ s.remove(); tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  };
  window.loadChartJs(function(ok){
    window.__chartJsLoaded = ok;
    if(window.__onChartJsReady) window.__onChartJsReady(ok);
  });
})();
</script>
<style>
/* ============================================================
   LEDGER — design tokens
   ============================================================ */
:root{
  --bg:#F3F4EE;
  --bg-elev:#FFFFFF;
  --bg-sunken:#EAEBE2;
  --ink:#16211F;
  --ink-soft:#4B5A56;
  --ink-faint:#828F89;
  --border:#DCDDD2;
  --border-soft:#E7E8DF;
  --accent:#2F6F62;
  --accent-ink:#F3F4EE;
  --accent-soft:#DCE8E3;
  --brass:#9C7A42;
  --brass-soft:#EFE6D3;
  --income:#2F6F62;
  --income-soft:#DCEAE5;
  --expense:#A8492F;
  --expense-soft:#F3E1DA;
  --transfer:#446080;
  --transfer-soft:#E1E7EE;
  --danger:#A8492F;
  --danger-soft:#F3E1DA;
  --shadow:rgba(22,33,31,0.10);
  --shadow-lg:rgba(22,33,31,0.16);
  --radius-sm:6px;
  --radius:12px;
  --radius-lg:18px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --topbar-h:60px;
  --bottomnav-h:64px;
  --sidebar-w:236px;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#101B1A;
  --bg-elev:#172422;
  --bg-sunken:#0C1413;
  --ink:#E9ECE7;
  --ink-soft:#AAB8B1;
  --ink-faint:#758079;
  --border:#283633;
  --border-soft:#1E2C29;
  --accent:#4FAE93;
  --accent-ink:#0B1A17;
  --accent-soft:#1B332C;
  --brass:#D2AE73;
  --brass-soft:#2E2818;
  --income:#4FAE93;
  --income-soft:#17332B;
  --expense:#E08A66;
  --expense-soft:#3A2620;
  --transfer:#8FADCC;
  --transfer-soft:#1F2C38;
  --danger:#E08A66;
  --danger-soft:#3A2620;
  --shadow:rgba(0,0,0,0.35);
  --shadow-lg:rgba(0,0,0,0.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  font-weight:600;
  margin:0;
  color:var(--ink);
  letter-spacing:-0.01em;
}
p{margin:0;}
a{color:var(--accent);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
ul{list-style:none;margin:0;padding:0;}
::selection{background:var(--accent-soft);color:var(--ink);}
.tnum{font-variant-numeric:tabular-nums;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* ============ App shell / layout ============ */
#app{min-height:100vh;display:flex;flex-direction:column;}
.shell{display:flex;flex:1;min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-elev);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  padding:22px 14px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:19px;color:var(--accent-ink);flex-shrink:0;
}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:-0.01em;}
.brand-sub{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase;margin-top:-2px;}

.nav-list{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-tab{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:8px 3px 3px 8px;
  color:var(--ink-soft);text-decoration:none;font-weight:500;font-size:14px;
  border-left:3px solid transparent;
  background:transparent;border-top:none;border-right:none;border-bottom:none;
  width:100%;text-align:left;position:relative;
}
.icon{width:16px;height:16px;flex-shrink:0;vertical-align:-3px;}
.nav-tab .icon{width:18px;height:18px;flex-shrink:0;display:inline-flex;vertical-align:baseline;}
.nav-tab:hover{background:var(--bg-sunken);color:var(--ink);}
.nav-tab.active{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent);font-weight:600;}

.sidebar-foot{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--border-soft);}
.sync-pill{
  display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;
  font-size:12.5px;color:var(--ink-soft);background:var(--bg-sunken);cursor:pointer;border:1px solid transparent;
}
.sync-pill:hover{border-color:var(--border);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
.sync-pill[data-state="synced"] .sync-dot{background:var(--income);}
.sync-pill[data-state="syncing"] .sync-dot{background:var(--brass);animation:pulse 1s ease-in-out infinite;}
.sync-pill[data-state="unsynced"] .sync-dot{background:var(--expense);}
.sync-pill[data-state="error"] .sync-dot{background:var(--expense);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.sidebar-toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:12.5px;color:var(--ink-soft);}
.credits-row{display:flex;align-items:center;gap:6px;padding:4px 10px 0;}
.credits-row .btn.icon-only{width:30px;height:30px;padding:6px;}
.credits-text{font-size:11px;color:var(--ink-faint);margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:none;
  align-items:center;justify-content:space-between;
  height:var(--topbar-h);padding:0 16px;
  background:var(--bg-elev);border-bottom:1px solid var(--border-soft);
  position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:var(--font-display);font-weight:600;font-size:18px;}
.view{padding:26px 32px 56px;max-width:1180px;width:100%;margin:0 auto;flex:1;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.view-head h1{font-size:26px;}
.view-head .sub{color:var(--ink-faint);font-size:13.5px;margin-top:4px;}

.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--bg-elev);border-top:1px solid var(--border-soft);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  justify-content:space-around;
}
.bottom-nav button{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--ink-faint);font-size:10.5px;padding:6px 8px;border-radius:8px;flex:1;font-weight:500;
}
.bottom-nav button .icon{width:20px;height:20px;}
.bottom-nav button.active{color:var(--accent);}

.fab{
  position:fixed;right:20px;bottom:calc(var(--bottomnav-h) + 18px);z-index:25;
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  border:none;box-shadow:0 6px 18px var(--shadow-lg);display:flex;align-items:center;justify-content:center;
  font-size:26px;line-height:1;
}
.fab .icon{width:24px;height:24px;vertical-align:0;}
@media (min-width:860px){.fab{right:36px;bottom:36px;}}

.privacy-fab{
  position:fixed;left:20px;bottom:calc(var(--bottomnav-h) + 18px);z-index:25;
  width:48px;height:48px;border-radius:50%;background:var(--bg-elev);color:var(--ink-soft);
  border:1px solid var(--border);box-shadow:0 6px 18px var(--shadow);display:flex;align-items:center;justify-content:center;
}
.privacy-fab:hover{border-color:var(--accent);color:var(--ink);}
.privacy-fab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.privacy-fab .icon{width:21px;height:21px;vertical-align:0;}
@media (min-width:860px){.privacy-fab{display:none;}}

/* ============ Buttons & forms ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-elev);color:var(--ink);font-weight:600;font-size:13.5px;
  text-decoration:none;
  transition:transform .08s ease,border-color .15s ease,background .15s ease;
}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.primary:hover{opacity:.92;}
.btn.danger{color:var(--expense);border-color:var(--expense-soft);}
.btn.danger:hover{border-color:var(--expense);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.ghost:hover{background:var(--bg-sunken);}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn.icon-only{padding:8px;width:36px;height:36px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.field .hint,.hint{font-size:11.5px;color:var(--ink-faint);}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=url],input[type=email],select,textarea{
  padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elev);color:var(--ink);width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:64px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}
.type-toggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.type-toggle button{flex:1;border:none;background:var(--bg-elev);padding:9px 6px;font-weight:600;font-size:12.5px;color:var(--ink-soft);border-right:1px solid var(--border);}
.type-toggle button:last-child{border-right:none;}
.type-toggle button.active{background:var(--accent-soft);color:var(--accent);}
.type-toggle button.active[data-type="income"]{background:var(--income-soft);color:var(--income);}
.type-toggle button.active[data-type="expense"]{background:var(--expense-soft);color:var(--expense);}
.type-toggle button.active[data-type="transfer"]{background:var(--transfer-soft);color:var(--transfer);}
.swatch-picker{display:flex;flex-wrap:wrap;gap:8px;}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.selected{border-color:var(--ink);}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;}

/* ============ Cards ============ */
.card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;box-shadow:0 1px 2px var(--shadow);}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}

.acct-card{
  position:relative;background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:18px 18px 16px;overflow:hidden;text-decoration:none;color:var(--ink);display:block;
  box-shadow:0 1px 2px var(--shadow);
}
.acct-card::before{
  content:"";position:absolute;top:0;left:18px;width:34px;height:8px;border-radius:0 0 4px 4px;
  background:var(--tab-color,var(--accent));
}
.acct-card .name{font-weight:600;font-size:14.5px;margin-top:6px;}
.acct-card .type{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;margin-top:1px;}
.acct-card .bal{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:14px;letter-spacing:-0.01em;}
.acct-card .bal.negative{color:var(--expense);}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px;}
.stat-card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px;}
.stat-card .label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.stat-card .value{font-family:var(--font-display);font-size:28px;font-weight:600;margin-top:6px;letter-spacing:-0.01em;}
.stat-card .value.income{color:var(--income);}
.stat-card .value.expense{color:var(--expense);}
.stat-card .delta{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px;}
.section-title h2{font-size:16px;}
.section-title .link{font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;background:none;border:none;}

.chart-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;}
@media (max-width:820px){.chart-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px;}
.chart-card h3{font-size:13.5px;margin-bottom:12px;}
.chart-wrap{position:relative;height:230px;}
.chart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:230px;color:var(--ink-faint);font-size:13px;text-align:center;padding:0 20px;}

/* ============ Ledger table (signature element) ============ */
.ledger{width:100%;border-collapse:collapse;}
.ledger thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);
  padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;
}
.ledger tbody tr{border-bottom:1px solid var(--border-soft);}
.ledger tbody tr:hover{background:var(--bg-sunken);}
.ledger td{padding:11px 10px;vertical-align:middle;font-size:13.5px;}
.ledger td.num,.ledger th.num{text-align:right;font-family:var(--font-mono);}
.ledger .desc{font-weight:500;}
.ledger .desc .meta{display:block;font-size:11.5px;color:var(--ink-faint);font-weight:400;margin-top:1px;}
.repeat-badge{display:inline-flex;vertical-align:-3px;margin-right:5px;color:var(--brass);}
.repeat-badge .icon{width:13px;height:13px;}
.ledger-mobile .desc .repeat-badge{vertical-align:-2px;}
.ledger .amt{font-family:var(--font-mono);font-weight:600;white-space:nowrap;}
.ledger .amt.income{color:var(--income);}
.ledger .amt.expense{color:var(--expense);}
.ledger .amt.transfer{color:var(--transfer);}
.ledger .running{font-family:var(--font-mono);color:var(--ink-soft);white-space:nowrap;}
.cat-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--bg-sunken);color:var(--ink-soft);white-space:nowrap;}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.row-actions{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity .1s;}
.ledger tbody tr:hover .row-actions{opacity:1;}
.acct-tag{font-size:11px;color:var(--ink-faint);}

.ledger-mobile{display:none;flex-direction:column;}
.ledger-mobile .txn-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 4px;border-bottom:1px solid var(--border-soft);
}
.ledger-mobile .txn-left{min-width:0;}
.ledger-mobile .txn-left .desc{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ledger-mobile .txn-left .meta{font-size:12px;color:var(--ink-faint);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ledger-mobile .txn-right{text-align:right;flex-shrink:0;}
.ledger-mobile .amt{font-family:var(--font-mono);font-weight:600;}
.ledger-mobile .running{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-top:2px;}

@media (max-width:760px){
  .ledger-desktop{display:none;}
  .ledger-mobile{display:flex;}
}

.filters-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:var(--radius);padding:14px;}
.filters-bar .field{margin-bottom:0;min-width:130px;flex:1;}
.filters-bar .field.search{flex:2;min-width:180px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.empty-state .glyph{font-family:var(--font-display);font-size:34px;color:var(--ink-faint);margin-bottom:8px;}
.empty-state h3{color:var(--ink-soft);font-size:15px;margin-bottom:6px;}
.empty-state p{font-size:13px;max-width:340px;margin:0 auto;}

/* ============ Modal ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,15,14,.5);display:flex;align-items:flex-end;justify-content:center;
  z-index:100;padding:0;backdrop-filter:blur(2px);
}
.modal{
  background:var(--bg-elev);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 30px var(--shadow-lg);
}
@media (min-width:640px){
  .modal-overlay{align-items:center;}
  .modal{border-radius:16px;padding:26px;}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h2{font-size:19px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-faint);padding:4px 8px;}
.modal-close .icon{width:18px;height:18px;vertical-align:0;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.modal p.warn,p.warn{background:var(--expense-soft);color:var(--expense);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
.modal p.info{background:var(--accent-soft);color:var(--accent);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}

/* ============ Toasts ============ */
.toast-root{position:fixed;bottom:calc(var(--bottomnav-h) + 14px);left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:92%;max-width:420px;}
@media (min-width:860px){.toast-root{bottom:20px;}}
.toast{
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;
  box-shadow:0 4px 16px var(--shadow-lg);display:flex;align-items:center;gap:10px;width:100%;
  animation:toast-in .18s ease;
}

<script>
(function(){
'use strict';

/* links */
var CREDITS_NAME = 'Apophis';
var BUY_ME_A_COFFEE_URL = 'https://buymeacoffee.com/apophisdevs';
var GITHUB_URL = 'https://github.com/thaclownminion/HTML-Cashbook';
/* ============================================================ */

/* ============================================================
   CONSTANTS
   ============================================================ */
var LS_SETTINGS = 'ledger_settings_v1';
var LS_DATA_CACHE = 'ledger_data_cache_v1';
var LS_DATA_SHA = 'ledger_data_sha_v1';
var LS_DIRTY = 'ledger_dirty_v1';
var LS_THEME = 'ledger_theme_v1';
var LS_PRIVACY = 'ledger_privacy_v1';
var IDB_NAME = 'ledger_idb_v1';
var IDB_STORE = 'handles';
var IDB_KEY_FILE = 'cashbook-file-handle';

var CURRENCIES = ['EUR','USD','GBP','CHF','JPY','CAD','AUD','SEK','NOK','DKK','PLN','CZK','INR','BRL','MXN','CNY','NZD','ZAR'];

var ACCOUNT_COLORS = ['#2F6F62','#446080','#9C7A42','#A8492F','#6B5B95','#3E7C9E','#7A8450','#B0616A'];
var CATEGORY_COLORS = ['#2F6F62','#A8492F','#446080','#9C7A42','#6B5B95','#3E7C9E','#7A8450','#B0616A','#4B5A56','#C77B58'];

var DEFAULT_CATEGORIES_SEED = [
  {name:'Salary',icon:'💼',defaultType:'income',color:'#2F6F62'},
  {name:'Other Income',icon:'➕',defaultType:'income',color:'#3E7C9E'},
  {name:'Groceries',icon:'🛒',defaultType:'expense',color:'#A8492F'},
  {name:'Rent & Housing',icon:'🏠',defaultType:'expense',color:'#9C7A42'},
  {name:'Utilities',icon:'💡',defaultType:'expense',color:'#6B5B95'},
  {name:'Transport',icon:'🚌',defaultType:'expense',color:'#446080'},
  {name:'Dining Out',icon:'🍽️',defaultType:'expense',color:'#C77B58'},
  {name:'Entertainment',icon:'🎬',defaultType:'expense',color:'#7A8450'},
  {name:'Health',icon:'💊',defaultType:'expense',color:'#B0616A'},
  {name:'Shopping',icon:'🛍️',defaultType:'expense',color:'#4B5A56'},
  {name:'Other',icon:'•',defaultType:'expense',color:'#828F89'}
];

/* ============================================================
   UTILITIES
   ============================================================ */
function uid(prefix){
  return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function todayISO(){
  var d=new Date();
  var tz = d.getTimezoneOffset()*60000;
  return new Date(d - tz).toISOString().slice(0,10);
}

function nowISO(){ return new Date().toISOString(); }

function formatMoney(amount, currency){
  currency = currency || (state.data && state.data.meta.defaultCurrency) || 'EUR';
  if(state.privacyMode) return maskedMoney(currency);
  var locale = navigator.language || 'en-US';
  try{
    return new Intl.NumberFormat(locale, {style:'currency', currency:currency, currencyDisplay:'symbol'}).format(amount);
  }catch(e){
    return currency+' '+amount.toFixed(2);
  }
}

// Renders a currency symbol followed by a dot mask, so figures stay hidden
// while it's still visible which currency an amount is in.
function maskedMoney(currency){
  var locale = navigator.language || 'en-US';
  try{
    var parts = new Intl.NumberFormat(locale, {style:'currency', currency:currency, currencyDisplay:'symbol'}).formatToParts(0);
    var symbol = parts.filter(function(p){ return p.type==='currency'; }).map(function(p){ return p.value; }).join('');
    return (symbol || currency) + ' \u2022\u2022\u2022\u2022';
  }catch(e){
    return (currency||'') + ' \u2022\u2022\u2022\u2022';
  }
}

function formatNumber(n){
  var locale = navigator.language || 'en-US';
  try{ return new Intl.NumberFormat(locale,{maximumFractionDigits:2}).format(n); }catch(e){ return String(n); }
}

function formatDate(iso, opts){
  if(!iso) return '';
  var d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return iso;
  var locale = navigator.language || 'en-US';
  opts = opts || {day:'numeric', month:'short', year:'numeric'};
  try{ return new Intl.DateTimeFormat(locale, opts).format(d); }catch(e){ return iso; }
}

function formatDateShort(iso){ return formatDate(iso, {day:'numeric', month:'short'}); }

function monthLabel(ym){
  var parts = ym.split('-');
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, 1);
  var locale = navigator.language || 'en-US';
  try{ return new Intl.DateTimeFormat(locale, {month:'short', year:'numeric'}).format(d); }catch(e){ return ym; }
}

function debounce(fn, wait){
  var t=null;
  return function(){
    var args=arguments, ctx=this;
    clearTimeout(t);
    t=setTimeout(function(){ fn.apply(ctx,args); }, wait);
  };
}

function b64EncodeUnicode(str){
  var bytes = new TextEncoder().encode(str);
  var binary = '';
  for(var i=0;i<bytes.length;i++){ binary += String.fromCharCode(bytes[i]); }
  return btoa(binary);
}

function b64DecodeUnicode(b64){
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for(var i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}

function downloadBlob(filename, content, mime){
  var blob = new Blob([content], {type: mime || 'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}

function toCSV(rows, headers){
  var lines = [headers.map(csvCell).join(',')];
  rows.forEach(function(r){ lines.push(headers.map(function(h){ return csvCell(r[h]); }).join(',')); });
  return lines.join('\r\n');
}
function csvCell(v){
  if(v===null||v===undefined) v='';
  v = String(v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}

function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

function monthKey(dateIso){ return dateIso.slice(0,7); }


/* ============================================================
   GLOBAL STATE
   ============================================================ */
var state = {
  settings: null,        // gitea connection settings
  data: null,             // {meta, accounts, categories, transactions}
  sha: null,               // last known remote file sha
  dirty: false,            // local changes not yet pushed
  syncState: 'idle',       // idle | syncing | synced | unsynced | error | conflict | offline
  lastError: null,
  lastSyncedAt: null,
  route: {name:'dashboard', params:{}},
  theme: 'light',
  privacyMode: false,      // when true, monetary amounts are masked on screen
  filters: {                // All-transactions view filters
    q:'', account:'', category:'', type:'', from:'', to:'', sort:'date_desc'
  },
  charts: {},               // canvasId -> Chart instance
  pendingConflict: null,    // remote payload waiting for user decision
  _pushing: false           // reentrancy guard for pushToRemote
};

function defaultData(){
  return {
    meta: { schemaVersion: 1, defaultCurrency: 'EUR', updatedAt: nowISO() },
    accounts: [],
    categories: DEFAULT_CATEGORIES_SEED.map(function(c){
      return { id: uid('cat'), name:c.name, icon:c.icon, color:c.color, defaultType:c.defaultType };
    }),
    transactions: [],
    recurring: []
  };
}

/* ============================================================
   LOCAL STORAGE — settings
   ============================================================ */
function loadSettings(){
  try{
    var raw = localStorage.getItem(LS_SETTINGS);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSettings(s){
  localStorage.setItem(LS_SETTINGS, JSON.stringify(s));
  state.settings = s;
}
function isConfigured(){
  var s = state.settings;
  if(!s || !s.storageMode) return false;
  if(s.storageMode === 'gitea') return !!(s.url && s.owner && s.repo && s.path && s.token);
  if(s.storageMode === 'local') return !!s.localMode;
  return false;
}

/* ============================================================
   LOCAL STORAGE — data cache (survives refresh / offline)
   ============================================================ */
function loadCache(){
  try{
    var raw = localStorage.getItem(LS_DATA_CACHE);
    var sha = localStorage.getItem(LS_DATA_SHA);
    var dirty = localStorage.getItem(LS_DIRTY) === '1';
    return { data: raw ? JSON.parse(raw) : null, sha: sha || null, dirty: dirty };
  }catch(e){ return {data:null, sha:null, dirty:false}; }
}
function saveCacheData(){
  try{ localStorage.setItem(LS_DATA_CACHE, JSON.stringify(state.data)); }catch(e){/* quota etc */}
}
function saveCacheSha(){
  if(state.sha) localStorage.setItem(LS_DATA_SHA, state.sha);
  else localStorage.removeItem(LS_DATA_SHA);
}
function saveDirtyFlag(){
  localStorage.setItem(LS_DIRTY, state.dirty ? '1' : '0');
}

function loadTheme(){
  var t = localStorage.getItem(LS_THEME);
  if(t) return t;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(t){
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem(LS_THEME, t);
}

function loadPrivacyMode(){
  try{ return localStorage.getItem(LS_PRIVACY) === '1'; }catch(e){ return false; }
}
function savePrivacyMode(on){
  try{ localStorage.setItem(LS_PRIVACY, on ? '1' : '0'); }catch(e){/* ignore */}
}

/* ============================================================
   LOCAL FILE STORAGE — an alternative to Gitea. Uses the File
   System Access API where the browser supports it (Chrome, Edge,
   other Chromium browsers), so the app can read/write a specific
   file directly. The file handle itself can't go in localStorage
   (it isn't a string), so it's kept in IndexedDB instead. Browsers
   without that API (Firefox, Safari) fall back to manual
   save/load via a normal file download + <input type=file>.
   ============================================================ */
function idbOpen(){
  return new Promise(function(resolve, reject){
    if(!('indexedDB' in window)){ reject(new Error('no-indexeddb')); return; }
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error('idb-open-failed')); };
  });
}
function idbSet(key, value){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readonly');
      var req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbDelete(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

function localFileApiSupported(){
  return typeof window.showOpenFilePicker === 'function' && typeof window.showSaveFilePicker === 'function';
}

async function ensureLocalFilePermission(handle, mode){
  mode = mode || 'readwrite';
  try{
    var opts = { mode: mode };
    var q = await handle.queryPermission(opts);
    if(q === 'granted') return true;
    var r = await handle.requestPermission(opts);
    return r === 'granted';
  }catch(e){ return false; }
}

async function pickExistingLocalFile(){
  var handles = await window.showOpenFilePicker({
    types: [{ description:'JSON', accept: {'application/json': ['.json']} }],
    excludeAcceptAllOption: false,
    multiple: false
  });
  var handle = handles[0];
  var granted = await ensureLocalFilePermission(handle, 'readwrite');
  if(!granted) throw new Error('permission-denied');
  await idbSet(IDB_KEY_FILE, handle);
  return handle;
}

async function createNewLocalFile(suggestedName){
  var handle = await window.showSaveFilePicker({
    suggestedName: suggestedName || 'cashbook.json',
    types: [{ description:'JSON', accept: {'application/json': ['.json']} }]
  });
  var granted = await ensureLocalFilePermission(handle, 'readwrite');
  if(!granted) throw new Error('permission-denied');
  await idbSet(IDB_KEY_FILE, handle);
  return handle;
}

async function getStoredFileHandle(){
  try{ return await idbGet(IDB_KEY_FILE); }catch(e){ return null; }
}

async function readLocalFile(handle){
  var file = await handle.getFile();
  return await file.text();
}

async function writeLocalFile(handle, dataObj){
  var writable = await handle.createWritable();
  await writable.write(JSON.stringify(dataObj, null, 2));
  await writable.close();
}

function localFileErrorMessage(err){
  var m = err && err.message;
  if(m==='not-connected') return 'No file connected — reconnect it in Settings.';
  if(m==='permission-denied') return 'Permission to access your file was not granted.';
  if(m==='invalid-json') return 'That file is not valid JSON.';
  if(err && err.name==='NotFoundError') return 'The file could not be found — it may have been moved or deleted. Reconnect it in Settings.';
  if(err && err.name==='AbortError') return 'Cancelled.';
  return (m || 'Unknown local file error') + '.';
}

// Universal fallback available in every browser: downloads the current data
// as a JSON file. Also doubles as an easy manual backup even in fsapi mode.
function manualSaveLocalFile(){
  var name = (state.settings && state.settings.localFileName) || 'cashbook.json';
  downloadBlob(name, JSON.stringify(state.data, null, 2), 'application/json');
  toast('Downloaded '+name+'. Keep it somewhere safe.', 'ok');
}


/* ============================================================
   GITEA API
   ============================================================ */
function GiteaError(status, message){
  this.name='GiteaError'; this.status=status; this.message=message||('Gitea API error '+status);
}
GiteaError.prototype = Object.create(Error.prototype);

function ConflictError(){ this.name='ConflictError'; this.message='File changed on the server since last sync'; }
ConflictError.prototype = Object.create(Error.prototype);

function encodePath(path){
  return String(path).split('/').filter(Boolean).map(encodeURIComponent).join('/');
}

function apiBase(){
  var s = state.settings;
  return s.url.replace(/\/+$/,'') + '/api/v1/repos/' + encodeURIComponent(s.owner) + '/' + encodeURIComponent(s.repo) + '/contents/' + encodePath(s.path);
}

function authHeaders(){
  return { 'Authorization': 'token ' + state.settings.token, 'Accept':'application/json' };
}

async function safeText(res){ try{ return await res.text(); }catch(e){ return ''; } }

function isNetworkError(err){
  return err instanceof TypeError; // fetch throws TypeError on network/CORS failure
}

// GET the data file. Returns {exists:true, sha, content:string} or {exists:false}
async function giteaGetFile(){
  var s = state.settings;
  var url = apiBase() + '?ref=' + encodeURIComponent(s.branch || 'main');
  var res;
  try{
    res = await fetch(url, { headers: authHeaders(), cache:'no-store' });
  }catch(err){
    if(isNetworkError(err)) throw new GiteaError(0, 'network');
    throw err;
  }
  if(res.status === 404) return { exists:false };
  if(res.status === 401 || res.status === 403) throw new GiteaError(res.status, 'auth');
  if(!res.ok) throw new GiteaError(res.status, await safeText(res));
  var json = await res.json();
  var content = '';
  if(json.content){
    content = b64DecodeUnicode(json.content.replace(/\n/g,''));
  } else if(json.download_url){
    var raw = await fetch(json.download_url, {headers: authHeaders()});
    content = await raw.text();
  }
  return { exists:true, sha: json.sha, content: content };
}

// PUT the data file (create or update). sha required when updating an existing file.
async function giteaPutFile(contentStr, sha, message){
  var s = state.settings;
  var url = apiBase();
  var body = {
    message: message || ('Update cash book — ' + new Date().toLocaleString()),
    content: b64EncodeUnicode(contentStr),
    branch: s.branch || 'main'
  };
  if(sha) body.sha = sha;
  var res;
  try{
    res = await fetch(url, {
      method:'PUT',
      headers: Object.assign({'Content-Type':'application/json'}, authHeaders()),
      body: JSON.stringify(body)
    });
  }catch(err){
    if(isNetworkError(err)) throw new GiteaError(0, 'network');
    throw err;
  }
  if(res.status === 409) throw new ConflictError();
  if(res.status === 401 || res.status === 403) throw new GiteaError(res.status, 'auth');
  if(!res.ok){
    var txt = await safeText(res);
    // Gitea sometimes reports sha mismatches as 400/422 depending on version
    if(/sha does not match|does not match|sha mismatch/i.test(txt)) throw new ConflictError();
    throw new GiteaError(res.status, txt);
  }
  var json = await res.json();
  return { sha: json.content ? json.content.sha : (json.sha || null) };
}

// Lightweight connectivity/auth check used by the Settings screen.
async function giteaTestConnection(tempSettings){
  var backup = state.settings;
  state.settings = tempSettings;
  try{
    var url = apiBase() + '?ref=' + encodeURIComponent(tempSettings.branch || 'main');
    var res;
    try{
      res = await fetch(url, { headers: authHeaders(), cache:'no-store' });
    }catch(err){
      if(isNetworkError(err)) return { ok:false, reason:'network' };
      return { ok:false, reason:'unknown' };
    }
    if(res.status === 404) return { ok:true, fileExists:false };
    if(res.status === 401 || res.status === 403) return { ok:false, reason:'auth' };
    if(!res.ok) return { ok:false, reason:'http', status: res.status };
    return { ok:true, fileExists:true };
  } finally {
    state.settings = backup;
  }
}


/* ============================================================
   DATA MODEL — accessors & CRUD
   All mutating functions call persistLocal() to cache + sync.
   ============================================================ */
function getAccount(id){
  return state.data.accounts.find(function(a){ return a.id===id; }) || null;
}
function getCategory(id){
  return state.data.categories.find(function(c){ return c.id===id; }) || null;
}
function listAccounts(opts){
  opts = opts || {};
  var list = state.data.accounts.slice();
  if(!opts.includeArchived) list = list.filter(function(a){ return !a.archived; });
  return list;
}
function listCategories(){ return state.data.categories.slice(); }

function numOr0(v){
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function signedAmountForAccount(txn, accountId){
  var amt = numOr0(txn.amount);
  if(txn.type === 'income') return txn.account === accountId ? amt : 0;
  if(txn.type === 'expense') return txn.account === accountId ? -amt : 0;
  if(txn.type === 'transfer'){
    if(txn.account === accountId) return -amt;
    if(txn.toAccount === accountId) return amt;
    return 0;
  }
  return 0;
}

function accountBalance(accountId){
  var acc = getAccount(accountId);
  if(!acc) return 0;
  var bal = numOr0(acc.startingBalance);
  state.data.transactions.forEach(function(t){ bal += signedAmountForAccount(t, accountId); });
  return bal;
}

function sortTxnsChrono(list){
  return list.slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.createdAt||'') < (b.createdAt||'') ? -1 : 1;
  });
}
function sortTxnsRecent(list){
  return list.slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (a.createdAt||'') < (b.createdAt||'') ? 1 : -1;
  });
}

// Returns chronological list with running balance for one account.
function accountLedger(accountId){
  var acc = getAccount(accountId);
  var txns = sortTxnsChrono(state.data.transactions.filter(function(t){
    return t.account===accountId || t.toAccount===accountId;
  }));
  var running = acc ? numOr0(acc.startingBalance) : 0;
  return txns.map(function(t){
    var signed = signedAmountForAccount(t, accountId);
    running += signed;
    return { txn:t, signed:signed, running:running };
  });
}

function filteredTransactions(f){
  f = f || state.filters;
  var list = state.data.transactions.slice();
  if(f.account) list = list.filter(function(t){ return t.account===f.account || t.toAccount===f.account; });
  if(f.category) list = list.filter(function(t){ return t.category===f.category; });
  if(f.type) list = list.filter(function(t){ return t.type===f.type; });
  if(f.from) list = list.filter(function(t){ return t.date >= f.from; });
  if(f.to) list = list.filter(function(t){ return t.date <= f.to; });
  if(f.q){
    var q = f.q.toLowerCase();
    list = list.filter(function(t){
      return (t.description||'').toLowerCase().indexOf(q)>-1 ||
             (t.notes||'').toLowerCase().indexOf(q)>-1 ||
             (t.tags||[]).join(' ').toLowerCase().indexOf(q)>-1;
    });
  }
  switch(f.sort){
    case 'date_asc': list = sortTxnsChrono(list); break;
    case 'amount_desc': list.sort(function(a,b){ return b.amount-a.amount; }); break;
    case 'amount_asc': list.sort(function(a,b){ return a.amount-b.amount; }); break;
    default: list = sortTxnsRecent(list);
  }
  return list;
}

function recentTransactions(n){
  return sortTxnsRecent(state.data.transactions).slice(0, n);
}

function currentMonthKey(){ return todayISO().slice(0,7); }

function monthlyTotals(ym){
  var income=0, expense=0;
  state.data.transactions.forEach(function(t){
    if(monthKey(t.date) !== ym) return;
    if(t.type==='income') income += t.amount;
    else if(t.type==='expense') expense += t.amount;
  });
  return { income:income, expense:expense, net: income-expense };
}

function categoryBreakdown(ym, type){
  type = type || 'expense';
  var totals = {};
  state.data.transactions.forEach(function(t){
    if(t.type!==type) return;
    if(ym && monthKey(t.date)!==ym) return;
    var key = t.category || '__none__';
    totals[key] = (totals[key]||0) + t.amount;
  });
  return Object.keys(totals).map(function(catId){
    var cat = getCategory(catId);
    return { categoryId:catId, name: cat ? cat.name : 'Uncategorized', color: cat ? cat.color : '#828F89', total: totals[catId] };
  }).sort(function(a,b){ return b.total-a.total; });
}

function accountBreakdown(){
  return listAccounts().map(function(a){ return { account:a, balance: accountBalance(a.id) }; });
}

// Balance trend across all (non-archived) accounts sharing the default currency, last N months.
function balanceTrendSeries(months){
  var accs = listAccounts();
  var byCur = {};
  accs.forEach(function(a){ byCur[a.currency] = (byCur[a.currency]||0)+1; });
  var mainCur = state.data.meta.defaultCurrency;
  var relevant = accs.filter(function(a){ return a.currency===mainCur; });
  var today = new Date();
  var labels = [], values = [];
  for(var i=months-1;i>=0;i--){
    var d = new Date(today.getFullYear(), today.getMonth()-i, 1);
    var ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var cutoff = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10);
    var total = 0;
    relevant.forEach(function(a){
      var bal = numOr0(a.startingBalance);
      state.data.transactions.forEach(function(t){
        if(t.date <= cutoff) bal += signedAmountForAccount(t, a.id);
      });
      total += bal;
    });
    labels.push(monthLabel(ym));
    values.push(total);
  }
  return { labels:labels, values:values, currency:mainCur };
}

function netWorthByCurrency(){
  var out = {};
  listAccounts().forEach(function(a){
    out[a.currency] = (out[a.currency]||0) + accountBalance(a.id);
  });
  return out;
}

    archived: false,

  };

function updateAccount(id, patch){
  var acc = getAccount(id);
  if(!acc) return;
  var clean = Object.assign({}, patch);
  if(clean.startingBalance !== undefined){
    var n = parseFloat(clean.startingBalance);
    clean.startingBalance = isNaN(n) ? 0 : n;
  }
  if(clean.name !== undefined) clean.name = String(clean.name).trim();
  if(clean.type !== undefined) clean.type = String(clean.type).trim();
  Object.assign(acc, clean);
  persistLocal('Update account “'+acc.name+'”');
}
function accountTxnCount(id){
  return state.data.transactions.filter(function(t){ return t.account===id || t.toAccount===id; }).length;
}
// Recurring rules (templates, not yet-generated transactions) that still point at this account.
function accountRecurringCount(id){
  return (state.data.recurring||[]).filter(function(r){ return r.account===id || r.toAccount===id; }).length;
}
function archiveAccount(id, archived){
  updateAccount(id, {archived: !!archived});
}
function deleteAccount(id){
  var acc = getAccount(id);
  if(!acc) return {ok:false};
  var count = accountTxnCount(id);
  var recCount = accountRecurringCount(id);
  if(count>0 || recCount>0) return {ok:false, count:count, recCount:recCount};
  state.data.accounts = state.data.accounts.filter(function(a){ return a.id!==id; });
  persistLocal('Delete account “'+acc.name+'”');
  return {ok:true};
}
// Permanently deletes an account plus every transaction that touches it
// (as the primary account, or as the other side of a transfer), and any
// recurring rules that still reference it. Irreversible.
function deleteAccountCascade(id){
  var acc = getAccount(id);
  if(!acc) return {ok:false};
  state.data.transactions = state.data.transactions.filter(function(t){
    return t.account!==id && t.toAccount!==id;
  });
  state.data.recurring = (state.data.recurring||[]).filter(function(r){
    return r.account!==id && r.toAccount!==id;
  });
  state.data.accounts = state.data.accounts.filter(function(a){ return a.id!==id; });
  persistLocal('Delete account “'+acc.name+'” and its transactions');
  return {ok:true};
}

/* ============================================================
   RECURRING TRANSACTIONS
   A recurring rule is a template ("this repeats every 2 weeks
   starting 1 Aug"). The engine below turns due occurrences into
   real transactions (tagged with recurringId) so balances, the
   ledger, reports and exports all just work — no special-casing
   needed anywhere else in the app.
   ============================================================ */
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function isoFromDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function dateFromISO(iso){ return new Date(iso+'T00:00:00'); }

function addDaysISO(iso, n){
  var d = dateFromISO(iso);
  d.setDate(d.getDate()+n);
  return isoFromDate(d);
}
// Adds N months to iso, clamping the day to the last valid day of the
// target month (so "31 Jan" + 1 month lands on 28/29 Feb, not March).
function addMonthsClampedISO(iso, n){
  var d = dateFromISO(iso);
  var day = d.getDate();
  var target = new Date(d.getFullYear(), d.getMonth()+n, 1);
  var lastDay = new Date(target.getFullYear(), target.getMonth()+1, 0).getDate();
  target.setDate(Math.min(day, lastDay));
  return isoFromDate(target);
}
function addYearsClampedISO(iso, n){
  var d = dateFromISO(iso);
  var lastDay = new Date(d.getFullYear()+n, d.getMonth()+1, 0).getDate();
  var target = new Date(d.getFullYear()+n, d.getMonth(), Math.min(d.getDate(), lastDay));
  return isoFromDate(target);
}
function weekdayName(iso){
  var locale = navigator.language || 'en-US';
  try{ return new Intl.DateTimeFormat(locale, {weekday:'long'}).format(dateFromISO(iso)); }
  catch(e){ return dateFromISO(iso).toDateString(); }
}
function monthDayLabel(iso){
  var locale = navigator.language || 'en-US';
  try{ return new Intl.DateTimeFormat(locale, {day:'numeric', month:'long'}).format(dateFromISO(iso)); }
  catch(e){ return iso; }
}
function ordinal(n){
  var s = ['th','st','nd','rd'], v = n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

// The k-th occurrence (k=0,1,2,...) of a rule, always computed fresh from
// the anchor (rule.startDate) rather than chained off the previous one —
// this is what prevents monthly clamping (e.g. day 31) from drifting
// permanently onto a shorter day after passing through a short month.
function occurrenceAtStep(rule, k){
  var n = k * (rule.interval||1);
  switch(rule.frequency){
    case 'daily': return addDaysISO(rule.startDate, n);
    case 'weekly': return addDaysISO(rule.startDate, n*7);
    case 'yearly': return addYearsClampedISO(rule.startDate, n);
    case 'monthly': default: return addMonthsClampedISO(rule.startDate, n);
  }
}

// First occurrence strictly after rule.lastGeneratedDate (or the anchor
// itself if nothing has been generated yet), regardless of whether it's
// already due. Used for "next due" displays and the Upcoming widget.
function nextOccurrenceOf(rule){
  if(!rule.lastGeneratedDate) return rule.startDate;
  var k = 0, guard = 0;
  while(guard++ < 5000){
    var occ = occurrenceAtStep(rule, k);
    if(occ > rule.lastGeneratedDate){
      if(rule.endDate && occ > rule.endDate) return null;
      return occ;
    }
    k++;
  }
  return null;
}

// All occurrences that are due (<= todayIso) and not yet generated,
// capped per run so a long-dormant rule can't create thousands of
// transactions in one go — it just catches up a bit more each sync.
function dueOccurrences(rule, todayIso, cap){
  var out = [], k = 0, guard = 0;
  while(guard++ < 5000 && out.length < cap){
    var occ = occurrenceAtStep(rule, k);
    k++;
    if(rule.lastGeneratedDate && occ <= rule.lastGeneratedDate) continue;
    if(occ > todayIso) break;
    if(rule.endDate && occ > rule.endDate) break;
    out.push(occ);
  }
  return out;
}

function describeRecurrence(rule){
  var unit = {daily:'day', weekly:'week', monthly:'month', yearly:'year'}[rule.frequency];
  var every = rule.interval>1 ? ('Every '+rule.interval+' '+unit+'s') : ('Every '+unit).replace('Every day','Daily');
  var detail = '';
  if(rule.frequency==='weekly') detail = ' on '+weekdayName(rule.startDate)+'s';
  else if(rule.frequency==='monthly') detail = ' on the '+ordinal(dateFromISO(rule.startDate).getDate())+(dateFromISO(rule.startDate).getDate()>28?' (or month end)':'');
  else if(rule.frequency==='yearly') detail = ' on '+monthDayLabel(rule.startDate);
  var end = rule.endDate ? (' · ends '+formatDate(rule.endDate)) : ' · no end date';
  return every+detail+end;
}

function getRecurring(id){ return (state.data.recurring||[]).find(function(r){ return r.id===id; }) || null; }

  rule.notes = (payload.notes||'').trim();
  rule.tags = payload.tags || [];

  runRecurringEngine();

function setRecurringActive(id, active){

  if(!rule) return;
  rule.active = !!active;
  persistLocal((active?'Resume':'Pause')+' recurring “'+(rule.description||rule.type)+'”');
  if(active) runRecurringEngine();
}
function deleteRecurringRuleOnly(id){

  persistLocal('Delete recurring “'+(rule.description||rule.type)+'” (kept its transactions)');
}
function deleteRecurringCascade(id){
  var rule = getRecurring(id);
  if(!rule) return;
  state.data.transactions = state.data.transactions.filter(function(t){ return t.recurringId!==id; });
  state.data.recurring = state.data.recurring.filter(function(r){ return r.id!==id; });
  persistLocal('Delete recurring “'+(rule.description||rule.type)+'” and its transactions');
}

// Materializes every due occurrence of every active rule into real
// transactions. Safe to call often — it's a no-op when nothing is due.
// Returns true if it created anything (so callers know whether to persist).
function runRecurringEngine(){
  if(!state.data || !Array.isArray(state.data.recurring) || state.data.recurring.length===0) return false;
  var today = todayISO();
  var changed = false;
  state.data.recurring.forEach(function(rule){
    if(!rule.active) return;
    if(!getAccount(rule.account)) return; // account was deleted out from under the rule
    var occ = dueOccurrences(rule, today, 366);
    if(occ.length===0) return;
    occ.forEach(function(date){
      state.data.transactions.push({
        id: uid('txn'), date: date, account: rule.account, toAccount: rule.toAccount||null,
        type: rule.type, category: rule.category||null, amount: rule.amount, currency: rule.currency,
        description: rule.description, notes: rule.notes, tags: (rule.tags||[]).slice(),
        recurringId: rule.id, createdAt: nowISO(), updatedAt: nowISO()
      });
    });
    rule.lastGeneratedDate = occ[occ.length-1];
    changed = true;
  });
  return changed;
}

/* ============================================================
   SYNC ORCHESTRATION
   ============================================================ */
function syncTick(){
  if(!state.settings) return;
  if(state.settings.storageMode === 'gitea') pushToRemote();
  else if(state.settings.storageMode === 'local' && state.settings.localMode === 'fsapi') pushToLocalFile();
  // manual local mode: nothing to push automatically — the user saves via a button.
}
var scheduledPush = debounce(syncTick, 1500);
var retryTimer = null;

function persistLocal(commitMessage){
  state.data.meta.updatedAt = nowISO();
  state.dirty = true;
  state.lastCommitMessage = commitMessage || 'Update cash book';
  saveCacheData();
  saveDirtyFlag();
  setSyncState('unsynced');
  renderSyncIndicators();
  render(); // reflect the change immediately in the UI
  scheduledPush();
}

function setSyncState(s, err){
  state.syncState = s;
  state.lastError = err || null;
  renderSyncIndicators();
}

async function pushToRemote(){
  if(!isConfigured()) return;
  if(state._pushing) return;
  if(!state.dirty) return;
  state._pushing = true;
  setSyncState('syncing');
  var payload = JSON.stringify(state.data, null, 2);
  try{
    var result = await giteaPutFile(payload, state.sha, state.lastCommitMessage);
    state.sha = result.sha;
    state.dirty = false;
    state.lastSyncedAt = nowISO();
    saveCacheSha();
    saveDirtyFlag();
    setSyncState('synced');
    clearRetry();
  }catch(err){
    if(err instanceof ConflictError){
      setSyncState('conflict');
      await handleConflict();
    } else if(err instanceof GiteaError && err.message==='auth'){
      setSyncState('error', 'Authentication failed — check your Gitea URL, repo path and token in Settings.');
      toast('Sync failed: authentication error. Check Settings.', 'error');
    } else if(err instanceof GiteaError && err.message==='network'){
      setSyncState('unsynced', 'Network/CORS error — changes saved locally.');
      scheduleRetry();
    } else {
      setSyncState('error', (err && err.message) || 'Unknown sync error');
      toast('Sync failed — changes are saved locally and will retry.', 'error');
      scheduleRetry();
    }
  }
  state._pushing = false;
}

function scheduleRetry(){
  clearRetry();
  retryTimer = setTimeout(function(){
    if(state.dirty) syncTick();
  }, 20000);
}
function clearRetry(){ if(retryTimer){ clearTimeout(retryTimer); retryTimer=null; } }

async function pushToLocalFile(){
  if(state._pushing) return;
  if(!state.dirty) return;
  state._pushing = true;
  setSyncState('syncing');
  try{
    var handle = await getStoredFileHandle();
    if(!handle) throw new Error('not-connected');
    var granted = await ensureLocalFilePermission(handle, 'readwrite');
    if(!granted) throw new Error('permission-denied');
    await writeLocalFile(handle, state.data);
    state.dirty = false;
    state.lastSyncedAt = nowISO();
    saveDirtyFlag();
    setSyncState('synced');
    clearRetry();
  }catch(err){
    var msg = localFileErrorMessage(err);
    setSyncState('error', msg);
    toast('Could not save to your file — changes stay in the browser. '+msg, 'error');
    scheduleRetry();
  }
  state._pushing = false;
}

// Reads the connected local file and adopts it as current state.
async function pullFromLocalFile(silent){
  setSyncState('syncing');
  try{
    var handle = await getStoredFileHandle();
    if(!handle) throw new Error('not-connected');
    var granted = await ensureLocalFilePermission(handle, 'readwrite');
    if(!granted) throw new Error('permission-denied');
    var text = await readLocalFile(handle);
    var parsed;
    try{ parsed = text.trim() ? JSON.parse(text) : defaultData(); }
    catch(e){ throw new Error('invalid-json'); }
    state.data = normalizeData(parsed);
    var generated = runRecurringEngine();
    state.dirty = generated;
    saveCacheData(); saveDirtyFlag();
    state.lastSyncedAt = nowISO();
    setSyncState(generated ? 'unsynced' : 'synced');
    if(!silent) toast('Loaded from your local file.', 'ok');
    render();
    if(generated) scheduledPush();
  }catch(err){
    var msg = localFileErrorMessage(err);
    setSyncState('error', msg);
    if(!silent) toast('Could not read your file. '+msg, 'error');
  }
}

async function syncNow(){
  if(!isConfigured()){ toast('Set up a storage location in Settings first.', 'error'); navigate('#/settings'); return; }
  var mode = state.settings.storageMode;
  if(mode === 'gitea'){
    if(state.dirty) await pushToRemote(); else await pullLatest(false);
  } else if(mode === 'local'){
    if(state.settings.localMode === 'fsapi'){
      if(state.dirty) await pushToLocalFile(); else await pullFromLocalFile(false);
    } else {
      toast('Manual mode: use "Save to file" or "Load from file" in Settings.', 'error');
      navigate('#/settings');
    }
  }
}

// Pull the remote file and adopt it as current state (used at startup, manual refresh, or conflict "load theirs").
async function pullLatest(silent){
  if(!isConfigured()) return;
  setSyncState('syncing');
  try{
    var res = await giteaGetFile();
    if(!res.exists){
      // Nothing on the server yet — seed it with current (or default) local data.
      var seed = state.data || defaultData();
      state.data = seed;
      state.sha = null;
      saveCacheData();
      state.dirty = true;
      saveDirtyFlag();
      await pushToRemote();
      return;
    }
    var remoteData;
    try{ remoteData = JSON.parse(res.content); }
    catch(e){ throw new Error('The remote data file is not valid JSON.'); }
    state.data = normalizeData(remoteData);
    state.sha = res.sha;
    var generated = runRecurringEngine();
    state.dirty = generated; // newly-generated occurrences need to be pushed back up
    saveCacheData(); saveCacheSha(); saveDirtyFlag();
    state.lastSyncedAt = nowISO();
    setSyncState(generated ? 'unsynced' : 'synced');
    if(!silent) toast('Synced with Gitea.', 'ok');
    render();
    if(generated) scheduledPush();
  }catch(err){
    if(err instanceof GiteaError && err.message==='auth'){
      setSyncState('error', 'Authentication failed — check Settings.');
      if(!silent) toast('Could not connect: authentication error.', 'error');
    } else if(err instanceof GiteaError && err.message==='network'){
      setSyncState('offline', 'Could not reach Gitea (network/CORS).');
      if(!silent) toast('Could not reach Gitea — check network/CORS. Working from local cache.', 'error');
    } else {
      setSyncState('error', (err&&err.message)||'Unknown error');
      if(!silent) toast('Sync error: '+((err&&err.message)||'unknown'), 'error');
    }
  }
}

async function handleConflict(){
  try{
    var res = await giteaGetFile();
    var remoteData = res.exists ? normalizeData(JSON.parse(res.content)) : defaultData();
    state.pendingConflict = { remoteData: remoteData, remoteSha: res.sha };
    openConflictModal();
  }catch(err){
    toast('Conflict detected but could not fetch the latest version. Try Sync now again.', 'error');
  }
}

function resolveConflictKeepMine(){
  if(!state.pendingConflict) return;
  state.sha = state.pendingConflict.remoteSha;
  state.pendingConflict = null;
  closeModal();
  setSyncState('unsynced');
  pushToRemote();
}
function resolveConflictLoadTheirs(){
  if(!state.pendingConflict) return;
  state.data = state.pendingConflict.remoteData;
  state.sha = state.pendingConflict.remoteSha;
  var generated = runRecurringEngine();
  state.dirty = generated;
  state.pendingConflict = null;
  saveCacheData(); saveCacheSha(); saveDirtyFlag();
  closeModal();
  setSyncState(generated ? 'unsynced' : 'synced');
  toast('Loaded the latest version from Gitea. Your local changes were discarded.', 'ok');
  render();
  if(generated) scheduledPush();
}

// Ensure a loaded JSON blob has the shape we expect (forward-compat / resilience).
function normalizeData(d){
  d = d || {};
  d.meta = d.meta || {};
  d.meta.schemaVersion = d.meta.schemaVersion || 1;
  d.meta.defaultCurrency = d.meta.defaultCurrency || 'EUR';
  d.accounts = Array.isArray(d.accounts) ? d.accounts : [];
  d.categories = Array.isArray(d.categories) ? d.categories : [];
  d.transactions = Array.isArray(d.transactions) ? d.transactions : [];
  d.recurring = Array.isArray(d.recurring) ? d.recurring : [];
  d.accounts.forEach(function(a){
    if(typeof a.archived!=='boolean') a.archived=false;
    if(!a.color) a.color=ACCOUNT_COLORS[0];
    a.startingBalance = numOr0(a.startingBalance);
  });
  d.transactions.forEach(function(t){ t.amount = numOr0(t.amount); });
  d.recurring.forEach(function(r){
    if(typeof r.active!=='boolean') r.active=true;
    r.amount = numOr0(r.amount);
    r.interval = Math.max(1, parseInt(r.interval,10)||1);
    if(['daily','weekly','monthly','yearly'].indexOf(r.frequency)===-1) r.frequency='monthly';
    if(!Array.isArray(r.tags)) r.tags=[];
  });
  return d;
}

/* ============================================================
   STARTUP
   ============================================================ */
async function initData(){
  var cache = loadCache();
  if(cache.data){
    state.data = normalizeData(cache.data);
    state.sha = cache.sha;
    state.dirty = cache.dirty;
  } else {
    state.data = defaultData();
  }

  if(runRecurringEngine()){
    saveCacheData();
    state.dirty = true;
    saveDirtyFlag();
  }
  startRecurringWatcher();

  if(!isConfigured()){
    render();
    return;
  }

  render(); // show cached/local data immediately while we sync

  var mode = state.settings.storageMode;
  if(mode === 'gitea'){
    if(state.dirty){
      // We have unsynced local edits from a previous session — try to push them first.
      setSyncState('unsynced');
      await pushToRemote();
    } else {
      await pullLatest(true);
    }
  } else if(mode === 'local'){
    if(state.settings.localMode === 'fsapi'){
      var handle = await getStoredFileHandle();
      if(!handle){
        setSyncState('error', 'No file connected — reconnect it in Settings.');
        return;
      }
      var granted = await ensureLocalFilePermission(handle, 'readwrite');
      if(!granted){
        setSyncState('error', 'Permission to your file was not granted — reconnect it in Settings.');
        return;
      }
      if(state.dirty) await pushToLocalFile();
      else await pullFromLocalFile(true);
    } else {
      // Manual mode: the local cache loaded above already IS the working state.
      setSyncState(state.dirty ? 'unsynced' : 'synced');
    }
  }
}

// If the app is left open across midnight (or a rule's due date), catch up
// on any newly-due recurring transactions without requiring a reload.
var _recurringWatcherLastDay = todayISO();
var _recurringWatcherStarted = false;
function startRecurringWatcher(){
  if(_recurringWatcherStarted) return;
  _recurringWatcherStarted = true;
  setInterval(function(){
    var today = todayISO();
    if(today !== _recurringWatcherLastDay){
      _recurringWatcherLastDay = today;
      if(runRecurringEngine()) persistLocal('Generate recurring transactions');
    }
  }, 5 * 60 * 1000);
}

window.addEventListener('online', function(){
  if(!state.dirty || !state.settings) return;
  syncTick();
});

/* ============================================================

   ============================================================ */
function toast(msg, kind){
  var root = qs('#toast-root');
  var el = document.createElement('div');
  el.className = 'toast' + (kind==='error' ? ' error' : '');
  el.innerHTML = (kind==='error' ? icon('alert') : icon('check')) + '<span>'+escapeHtml(msg)+'</span>';
  root.appendChild(el);
  setTimeout(function(){
    el.style.transition='opacity .25s ease';
    el.style.opacity='0';
    setTimeout(function(){ el.remove(); }, 260);
  }, 3200);
}

   ============================================================ */
function openModal(html){
  closeModal();
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  overlay.addEventListener('mousedown', function(e){ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
  document.addEventListener('keydown', escCloseModal);
}
function escCloseModal(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  var overlay = qs('#modal-overlay');
  if(overlay) overlay.remove();
  document.removeEventListener('keydown', escCloseModal);
}

   ============================================================ */
function parseHash(){
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/').filter(Boolean);
  if(parts.length===0) return {name:'dashboard', params:{}};
  if(parts[0]==='account' && parts[1]) return {name:'account', params:{id:parts[1]}};
  if(['dashboard','transactions','reports','settings'].indexOf(parts[0])>-1) return {name:parts[0], params:{}};
  return {name:'dashboard', params:{}};
}
function navigate(hash){
  if(location.hash === hash){ state.route = parseHash(); render(); }
  else location.hash = hash;
}
window.addEventListener('hashchange', function(){ state.route = parseHash(); render(); });

// Shared finish-up for any local-mode onboarding path: adopt the given data,
// run the recurring engine once, cache it, and start the watcher.
function finishOnboardingWithData(dataObj){
  state.data = normalizeData(dataObj);
  var generated = runRecurringEngine();
  saveCacheData();
  startRecurringWatcher();
  return generated;
}

async function onboardCreateLocalFile(){
  var statusEl = qs('#onboard-local-status');
  try{
    var handle = await createNewLocalFile('cashbook.json');
    await writeLocalFile(handle, defaultData());
    saveSettings({ storageMode:'local', localMode:'fsapi', localFileName: handle.name });
    var generated = finishOnboardingWithData(defaultData());
    state.dirty = generated; saveDirtyFlag();
    setSyncState(generated ? 'unsynced' : 'synced');
    toast('Created '+handle.name+'.', 'ok');
    render();
    if(generated) scheduledPush();
  }catch(err){
    if(err && err.name==='AbortError') return;
    if(statusEl) statusEl.innerHTML = '<div class="conn-status bad">'+icon('alert')+' Could not create the file: '+escapeHtml((err&&err.message)||'unknown error')+'</div>';
  }
}

async function onboardOpenLocalFile(){
  var statusEl = qs('#onboard-local-status');
  try{
    var handle = await pickExistingLocalFile();
    var text = await readLocalFile(handle);
    var parsed = text.trim() ? JSON.parse(text) : defaultData();
    saveSettings({ storageMode:'local', localMode:'fsapi', localFileName: handle.name });
    var generated = finishOnboardingWithData(parsed);
    state.dirty = generated; saveDirtyFlag();
    setSyncState(generated ? 'unsynced' : 'synced');
    toast('Connected '+handle.name+'.', 'ok');
    render();
    if(generated) scheduledPush();
  }catch(err){
    if(err && err.name==='AbortError') return;
    if(statusEl) statusEl.innerHTML = '<div class="conn-status bad">'+icon('alert')+' Could not open that file: '+escapeHtml((err&&err.message)||'not valid JSON')+'</div>';
  }
}

function onboardManualLoad(inputEl){
  var file = inputEl.files && inputEl.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      saveSettings({ storageMode:'local', localMode:'manual', localFileName: file.name });
      var generated = finishOnboardingWithData(parsed);
      state.dirty = generated; saveDirtyFlag();
      setSyncState(generated ? 'unsynced' : 'synced');
      toast('Loaded '+file.name+'.', 'ok');
      render();
    }catch(e){ toast('That file is not valid JSON.', 'error'); }
  };
  reader.readAsText(file);
}

function onboardStartManualFresh(){
  saveSettings({ storageMode:'local', localMode:'manual', localFileName:'cashbook.json' });
  finishOnboardingWithData(defaultData());
  state.dirty = true; saveDirtyFlag();
  setSyncState('unsynced');
  toast('Started a new cash book. Use "Save to file" in Settings to keep a copy.', 'ok');
  render();
}

async function testGiteaForm(context){
  var s = readGiteaForm();
  if(!s.url || !s.owner || !s.repo || !s.token){ toast('Fill in URL, owner, repo and token first.', 'error'); return; }
  var statusEl = context==='onboard' ? qs('#onboard-status') : qs('#settings-conn-status');
  if(statusEl) statusEl.innerHTML = '<div class="conn-status" style="background:var(--bg-sunken);color:var(--ink-soft);">'+ '<div class="spinner"></div> Testing…</div>';
  var result = await giteaTestConnection(s);
  if(!statusEl) return;
  if(result.ok){
    statusEl.innerHTML = '<div class="conn-status ok">'+icon('check')+(result.fileExists ? ' Connected — data file found.' : ' Connected — data file will be created on first save.')+'</div>';
  } else if(result.reason==='network'){
    statusEl.innerHTML = '<div class="conn-status bad">'+icon('alert')+' Network/CORS error — see the note below.</div>';
  } else if(result.reason==='auth'){
    statusEl.innerHTML = '<div class="conn-status bad">'+icon('alert')+' Authentication failed — check owner/repo/token.</div>';
  } else {
    statusEl.innerHTML = '<div class="conn-status bad">'+icon('alert')+' Could not connect (HTTP '+(result.status||'?')+').</div>';
  }
}

async function saveGiteaForm(context){
  var s = readGiteaForm();
  if(!s.url || !s.owner || !s.repo || !s.token){ toast('Fill in URL, owner, repo and token first.', 'error'); return; }
  saveSettings(s);
  toast('Connected. Loading your data…', 'ok');
  await initData();
  if(context==='onboard') render();
}

    setSyncState('synced');

    render();
  }catch(err){
    if(err && err.name==='AbortError') return;
    toast('Could not create the file: '+((err&&err.message)||'unknown error'), 'error');
  }
}

async function settingsOpenLocalFile(){
  try{
    var handle = await pickExistingLocalFile();
    var text = await readLocalFile(handle);
    var parsed = text.trim() ? JSON.parse(text) : defaultData();
    saveSettings(Object.assign({}, state.settings, { storageMode:'local', localMode:'fsapi', localFileName: handle.name }));
    state._settingsStorageTab = 'local';
    state.data = normalizeData(parsed);
    var generated = runRecurringEngine();
    state.dirty = generated;
    saveCacheData(); saveDirtyFlag();
    setSyncState(generated ? 'unsynced' : 'synced');
    toast('Now using '+handle.name+'.', 'ok');
    render();
    if(generated) scheduledPush();
  }catch(err){
    if(err && err.name==='AbortError') return;
    toast('Could not open that file: '+((err&&err.message)||'not valid JSON'), 'error');
  }
}

function settingsManualLoad(inputEl){
  var file = inputEl.files && inputEl.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      saveSettings(Object.assign({}, state.settings, { storageMode:'local', localMode:'manual', localFileName: file.name }));
      state._settingsStorageTab = 'local';
      state.data = normalizeData(parsed);
      var generated = runRecurringEngine();
      state.dirty = generated;
      saveCacheData(); saveDirtyFlag();
      setSyncState(generated ? 'unsynced' : 'synced');
      toast('Switched to local file: loaded '+file.name+'.', 'ok');
      render();
    }catch(e){ toast('That file is not valid JSON.', 'error'); }
  };
  reader.readAsText(file);
  inputEl.value = '';
}

      interval: qs('#t-repeat-interval').value,
      startDate: payload.date,
      endDate: (endBtn && endBtn.getAttribute('data-end')==='date') ? (qs('#t-repeat-enddate').value || null) : null
    });
    if(id){
      // This transaction already existed as a one-off — turn it into the
      // first occurrence of a new series without duplicating it.
      updateTransaction(id, payload);
      var newRule = addRecurring(recPayload, payload.date);
      var editedTxn = state.data.transactions.find(function(t){ return t.id===id; });
      if(editedTxn) editedTxn.recurringId = newRule.id;
    } else {
      addRecurring(recPayload, null);
    }
    runRecurringEngine();
    persistLocal(id ? 'Make transaction recurring' : 'Add recurring transaction');
  } else {
    if(id) updateTransaction(id, payload); else addTransaction(payload);
  }
  closeModal();
  toast(id?'Transaction updated.':(wantsRepeat?'Recurring transaction added.':'Transaction added.'), 'ok');
  render();
  return false;
}

/* ============================================================

function pickRecurringType(el){
  qsa('#r-type-toggle button').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  var type = el.getAttribute('data-type');
  qs('#r-to-account-field').style.display = type==='transfer' ? 'flex' : 'none';
  qs('#r-category-field').style.display = type==='transfer' ? 'none' : 'flex';
  qs('#r-account-label').textContent = type==='transfer' ? 'From account' : 'Account';
}
function pickRepeatEnd_(el, prefix){
  qsa('#'+prefix+'-end-toggle button').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  qs('#'+prefix+'-enddate-field').style.display = el.getAttribute('data-end')==='date' ? 'flex' : 'none';
  if(prefix==='r') updateRecurringPreview(); else updateRepeatPreview();
}
function updateRecurringPreview(){
  var preview = qs('#r-preview');
  if(!preview) return;
  var endBtn = qs('#r-end-toggle button.active');
  var tempRule = {
    frequency: qs('#r-freq').value,
    interval: parseInt(qs('#r-interval').value,10)||1,
    startDate: qs('#r-start').value || todayISO(),
    endDate: (endBtn && endBtn.getAttribute('data-end')==='date') ? (qs('#r-enddate').value||null) : null
  };
  preview.textContent = 'Starts '+formatDate(tempRule.startDate)+' · '+describeRecurrence(tempRule);
}
function submitRecurringForm(e, id){
  e.preventDefault();
  var typeBtn = qs('#r-type-toggle button.active');
  var type = typeBtn ? typeBtn.getAttribute('data-type') : 'expense';
  var accountId = qs('#r-account').value;
  var toAccountId = qs('#r-to-account').value;
  if(type==='transfer' && accountId===toAccountId){ toast('Pick two different accounts for a transfer.', 'error'); return false; }
  var amount = parseFloat(qs('#r-amount').value);
  if(!amount || amount<=0){ toast('Enter an amount greater than zero.', 'error'); return false; }
  var endBtn = qs('#r-end-toggle button.active');
  var payload = {
    account: accountId, toAccount: toAccountId, type: type,
    category: qs('#r-category').value || null, amount: amount,
    currency: (getAccount(accountId)||{}).currency,
    description: qs('#r-desc').value, notes: '', tags: [],
    frequency: qs('#r-freq').value, interval: qs('#r-interval').value,
    startDate: qs('#r-start').value || todayISO(),
    endDate: (endBtn && endBtn.getAttribute('data-end')==='date') ? (qs('#r-enddate').value||null) : null
  };
  if(id){
    updateRecurring(id, payload);
  } else {
    addRecurring(payload, null);
    runRecurringEngine();
    persistLocal('Add recurring transaction');
  }
  closeModal();
  toast(id?'Recurring transaction updated.':'Recurring transaction added.', 'ok');
  render();
  return false;
}
function confirmDeleteRecurring(id){
  var rule = getRecurring(id);
  if(!rule) return;
  var count = recurringTxnCount(id);
  openModal(
    '<div class="modal-head"><h2>Delete “'+escapeHtml(rule.description||rule.type)+'”?</h2><button class="modal-close" onclick="Ledger.closeModal()">'+icon('x')+'</button></div>'+
    (count>0
      ? '<p class="warn">'+icon('alert')+' This series has generated '+count+' transaction'+(count===1?'':'s')+' so far. You can stop it and keep that history, or delete the series along with all '+count+' transaction'+(count===1?'':'s')+' it created.</p>'+
        '<div class="btn-row" style="flex-direction:column;">'+
          '<button class="btn primary" style="width:100%;" onclick="Ledger.doDeleteRecurring(\''+id+'\',false)">Stop series (keep its '+count+' transaction'+(count===1?'':'s')+')</button>'+
          '<button class="btn danger" style="width:100%;" onclick="Ledger.doDeleteRecurring(\''+id+'\',true)">Delete series and its '+count+' transaction'+(count===1?'':'s')+'</button>'+
          '<button class="btn ghost" style="width:100%;" onclick="Ledger.closeModal()">Cancel</button>'+
        '</div>'
      : '<p class="warn">'+icon('alert')+' This hasn\'t generated any transactions yet. This can\'t be undone.</p>'+
        '<div class="modal-foot"><button class="btn" onclick="Ledger.closeModal()">Cancel</button><button class="btn danger" onclick="Ledger.doDeleteRecurring(\''+id+'\',false)">Delete</button></div>'
    )
  );
}
function doDeleteRecurring(id, cascade){
  if(cascade) deleteRecurringCascade(id); else deleteRecurringRuleOnly(id);
  closeModal();
  toast('Recurring transaction deleted.', 'ok');
  render();
}
function toggleRecurringActive(id){
  var rule = getRecurring(id);
  if(!rule) return;
  setRecurringActive(id, !rule.active);

function confirmDeleteTxn(id){

}

// Active recurring rules with a next occurrence within `days` days from today.
function upcomingRecurring(days, limit){
  var today = todayISO();
  var horizon = addDaysISO(today, days);
  var items = [];
  listRecurring().forEach(function(r){
    if(!r.active) return;
    var next = nextOccurrenceOf(r);
    if(next && next <= horizon) items.push({rule:r, date:next});
  });
  items.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  return limit ? items.slice(0, limit) : items;
}
function relativeDayLabel(iso){
  var today = todayISO();
  if(iso===today) return 'Today';
  if(iso===addDaysISO(today,1)) return 'Tomorrow';
  return formatDateShort(iso);
}
function renderUpcomingList(items){
  var desktop = '<table class="ledger ledger-desktop"><thead><tr><th>When</th><th>Description</th><th>Account</th><th class="num">Amount</th></tr></thead><tbody>'+
    items.map(function(it){
      var r = it.rule, acc = getAccount(r.account);
      return '<tr onclick="Ledger.openRecurringModal(\''+r.id+'\')" style="cursor:pointer;">'+
        '<td class="muted">'+relativeDayLabel(it.date)+'</td>'+
        '<td class="desc">'+icon('repeat')+' '+escapeHtml(r.description||(r.type.charAt(0).toUpperCase()+r.type.slice(1)))+'</td>'+
        '<td class="acct-tag">'+escapeHtml(acc?acc.name:'?')+'</td>'+
        '<td class="num amt '+txnAmountClass(r)+'">'+txnTypeSign(r)+' '+formatMoney(r.amount, r.currency)+'</td>'+
      '</tr>';
    }).join('')+
  '</tbody></table>';
  var mobile = '<div class="ledger-mobile">'+ items.map(function(it){
    var r = it.rule, acc = getAccount(r.account);
    return '<div class="txn-row" onclick="Ledger.openRecurringModal(\''+r.id+'\')">'+
      '<div class="txn-left"><div class="desc">'+icon('repeat')+' '+escapeHtml(r.description||(r.type.charAt(0).toUpperCase()+r.type.slice(1)))+'</div><div class="meta">'+relativeDayLabel(it.date)+' · '+escapeHtml(acc?acc.name:'?')+'</div></div>'+
      '<div class="txn-right"><div class="amt '+txnAmountClass(r)+'">'+txnTypeSign(r)+' '+formatMoney(r.amount, r.currency)+'</div></div>'+
    '</div>';
  }).join('') + '</div>';
  return desktop + mobile;
}
